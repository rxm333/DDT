# Site Dame de Tours (Astro) : construit le site et le publie sur la branche « deploy ».
# Hostinger récupère cette branche dans public_html : le site est rangé dans preprod/ (pages HTML prêtes, .htaccess compris).
#
# Se déclenche :
#  - à chaque modification du site (web/) ou des scripts du site (site-scripts/) sur main ;
#  - quand un contenu est publié dans Sanity : vérification toutes les 5 minutes (rien n'est reconstruit
#    si rien n'a changé), ou tout de suite via un webhook Sanity → repository_dispatch « sanity-publish » ;
#  - à la main (onglet Actions → « Site Astro » → Run workflow).
# L'espace d'écriture Sanity (studio/) est construit en même temps et servi sur /studio.
name: Site Astro

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'studio/**'
      - 'site-scripts/dist/**'
      - 'site-scripts/models/**'
      - 'site-scripts/fonts/**'
      - 'site-scripts/assets/**'
      - '.github/workflows/site-astro.yml'
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: site-astro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Passage programmé : on ne reconstruit que si un contenu Sanity a changé depuis la dernière publication
      - name: Contenus Sanity modifiés ?
        id: check
        run: |
          Q='{"n":count(*[_type=="article" && !(_id in path("drafts.**"))]),"t":*[_type=="article" && !(_id in path("drafts.**"))]|order(_updatedAt desc)[0]._updatedAt}'
          STAMP=$(curl -fsS -m 20 -G "https://bh9d2sfy.api.sanity.io/v2025-02-19/data/query/production" --data-urlencode "query=$Q" | jq -c .result) || STAMP=injoignable
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          LAST=$(git fetch -q --depth 1 origin deploy 2>/dev/null && git show origin/deploy:sanity-stamp.txt 2>/dev/null || echo none)
          echo "Sanity : $STAMP — dernière publication : $LAST"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$STAMP" = "$LAST" ] || [ "$STAMP" = "injoignable" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Aucun changement : rien à publier."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            studio/package-lock.json

      - name: Installation
        if: steps.check.outputs.skip != 'true'
        working-directory: web
        run: npm ci

      - name: Construction
        if: steps.check.outputs.skip != 'true'
        working-directory: web
        env:
          SITE_URL: https://damedetours.com
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run build

      - name: Espace d'écriture Sanity (/studio)
        if: steps.check.outputs.skip != 'true'
        env:
          SANITY_STUDIO_TELEMETRY_DISABLED: '1'
        run: |
          cd studio && npm ci && npx sanity build dist --yes
          cp -r dist ../web/dist/studio
          echo '${{ steps.check.outputs.stamp }}' > ../web/dist/sanity-stamp.txt

      - name: Contrôles (titres, liens, données Google…)
        if: steps.check.outputs.skip != 'true'
        working-directory: web
        run: npm test

      - name: Publication sur la branche deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch --depth 1 origin deploy
            git worktree add -B deploy /tmp/deploy origin/deploy
          else
            git worktree add --orphan -b deploy /tmp/deploy
          fi
          # Hostinger déploie la branche dans public_html : le site va dans le sous-dossier du sous-domaine.
          # (Le jour de la mise en ligne sur damedetours.com : DEPLOY_DIR vide → site à la racine.)
          DEPLOY_DIR=preprod
          find /tmp/deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p "/tmp/deploy/$DEPLOY_DIR"
          rsync -a web/dist/ "/tmp/deploy/$DEPLOY_DIR/"
          if [ -n "$DEPLOY_DIR" ]; then
            # À la racine de public_html : seulement de quoi cacher le dossier .git du déploiement
            printf '%s\n' '# Racine de public_html (déploiement Hostinger) : le site est dans preprod/.' 'RedirectMatch 404 /\.git' > /tmp/deploy/.htaccess
          fi
          cd /tmp/deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Rien n'a changé."
          else
            git commit -q -m "Site construit depuis ${GITHUB_SHA::7} (${{ github.event_name }})"
            git push origin deploy
          fi
