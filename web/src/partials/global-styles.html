/* ---------- Atelier : marquee d'images (CSS pur, aucune interaction Webflow) ---------- */
@keyframes atelier-marquee {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-100%, 0, 0); }
}
.atelier_marquee-list {
  animation: atelier-marquee 40s linear infinite;
  will-change: transform;
}
/* Pause au survol et via le contrôle « Mettre en pause » (WCAG 2.2.2) */
.atelier_marquee:hover .atelier_marquee-list,
.section_atelier:has(.atelier_pause-input:checked) .atelier_marquee-list {
  animation-play-state: paused;
}
.atelier_pause-input:focus-visible + .atelier_pause-button {
  outline: 2px solid var(--_theme---system--focus-state);
  outline-offset: 2px;
}
.atelier_pause-input:checked + .atelier_pause-button {
  color: var(--_theme---text--default);
  box-shadow: inset 0 0 0 1px var(--_theme---accent--default);
}
/* Mouvement réduit : pas d'animation, défilement manuel, pas de doublon */
@media (prefers-reduced-motion: reduce) {
  .atelier_marquee-list { animation: none; }
  .atelier_marquee { overflow-x: auto; }
  .atelier_marquee-list[aria-hidden="true"] { display: none; }
  .atelier_controls { display: none; }
}
/* ---------- Pages légales ---------- */
/* Lien actif de la navigation latérale */
.legal-nav_link.w--current:not([href*="#"]),
.legal-nav_link[aria-current="page"] {
  background-color: var(--_theme---bg--soft);
  color: var(--_theme---text--default);
  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
}
/* Pas de filet sous le dernier article (articles directs ou groupés) */
.legal_document > .legal_article:last-child,
.legal_document > .legal_group:last-child > .legal_article:last-child {
  border-bottom-width: 0;
}
@media (prefers-reduced-motion: reduce) {
  .legal-nav_link, .legal_link { transition: none; }
}
/* ---------- Page Collection ---------- */
/* Ancre « Voir les modèles » : compense la navbar fixe */

/* Lettre de l'atelier : typographie proportionnelle à la feuille (container queries), avec minimums lisibles sur mobile */
.col-note_sheet { container-type: inline-size; }

.col-note_title { font-size: max(1.75rem, 5cqw); }

}

@media (prefers-reduced-motion: reduce) {
  .col-note_film-icon { transition: none; }
  .col-note_film-button:hover .col-note_film-icon { transform: none; }
}
